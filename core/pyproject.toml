[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-core"
version = "0.1.0"
description = "The one implementation of the Cortex cascade in code: resolution, merge semantics, capability catalog, prompt assembly and overlay validation (ADR-007)."
requires-python = ">=3.9"
readme = "README.md"
# No dependency, on purpose: the core must run from source on a host machine, with no
# install step (ADR-007 §3.3). Anything added here breaks the validator's shim.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_core*"]
