[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-core"
version = "0.1.0"
description = "The one implementation of the Cortex cascade in code: resolution, merge semantics, capability catalog, prompt assembly and overlay validation (ADR-007)."
requires-python = ">=3.11"
readme = "README.md"
# No dependency, on purpose: the core is standard library only (ADR-007 §3.3), and the
# `cortex` binary embeds nothing else (ADR-008).
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_core*"]
