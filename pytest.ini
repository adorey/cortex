# For one pytest session over the three suites — an IDE's test explorer, `pytest core/tests runtime/tests cli/tests`.
# All three are packages named `tests`, which pytest's default import mode cannot tell apart. Each
# suite's own command stays `python -m unittest discover -s tests` (core/README.md, runtime/README.md, cli/README.md).
[pytest]
addopts = --import-mode=importlib
