name: cli tests

# The `cortex` command (ADR-008), from source, on the three platforms it ships for. The built
# binary replays the same suite in the binary workflow; this one runs on every change first.
on:
  push:
    paths:
      - "cli/**"
      - "core/**"
      - "agents/**"
      - "templates/**"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    paths:
      - "cli/**"
      - "core/**"
      - "agents/**"
      - "templates/**"
      - ".github/workflows/cli-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: cortex-cli (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the floor cli/pyproject.toml declares, for tomllib.
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing is installed: the tests run the command from core/ and cli/ as they are.
      - name: Run the CLI suite
        working-directory: cli
        run: python -m unittest discover -s tests -v
