name: core tests

# cortex-core is the one implementation of the cascade in code (ADR-007). It also reads the
# spec itself — the self-hosting test resolves Cortex's own agents/ — so spec changes run it.
on:
  push:
    branches: [main, "release/**", "[0-9]+.x"]     # a pull request's branch runs as a pull request, once
  pull_request:
  merge_group:

# A pull request's run is moot once its branch is pushed again: it is cancelled. On main, a release
# branch or a line's branch, a run in progress is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No `paths` filter: a check that GitHub never starts stays pending, and a pull request that needs
  # it can never merge (ADR-009 §3.10). This job reads what changed; the jobs below are skipped
  # when nothing they test did, which GitHub counts as passing, and the summary reports for them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # the merge base of the change
          persist-credentials: false   # nothing here pushes: the token stays out of .git/config
      - id: changes
        uses: ./.github/actions/changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          # the core, and the spec its self-hosting test resolves
          paths: |
            core/**
            agents/**
            cli/tests/**
            .github/workflows/core-tests.yml

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cortex-core (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python the image ships — whatever `ubuntu-latest` is — and the floor of
          # pyproject.toml, 3.11, as the CLI and the runtime have. A floor CI never runs on is a
          # claim, not a guarantee.
          - { label: "Ubuntu, image's Python", python-version: "" }
          - { label: "Python 3.11", python-version: "3.11" }
    steps:
      - uses: actions/checkout@v7

      - if: matrix.python-version != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing is installed, on purpose: the core runs from source (ADR-007 §3.3).
      - name: Run the core suite
        working-directory: core
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          python3 -m unittest discover -s tests -v

  macos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The Python the image ships, on a file system that ignores case, where two spellings of one
    # directory must still be one. The whole suite: the validator lists files in name order, not
    # in the file system's, so the outputs captured on ext4 hold on APFS too (ADR-008 §3.1).
    name: cortex-core (macOS, image's Python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the core suite
        working-directory: core
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          python3 -m unittest discover -s tests -v

  # The one check the ruleset requires of this workflow, by a name no matrix changes: it fails when
  # a job it needs failed or was cancelled, and passes when each passed or was skipped (§3.10).
  summary:
    name: core tests
    if: always()
    needs: [changes, test, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
