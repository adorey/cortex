name: core tests

# cortex-core is the one implementation of the cascade in code (ADR-007). It also reads the
# spec itself — the self-hosting test resolves Cortex's own agents/ — so spec changes run it.
on:
  push:
    branches: [main, "release/**"]     # a pull request's branch runs as a pull request, once
    paths:
      - "core/**"
      - "agents/**"
      - "cli/tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "core/**"
      - "agents/**"
      - "cli/tests/**"
      - ".github/workflows/core-tests.yml"

# A pull request's run is moot once its branch is pushed again: it is cancelled. On main, a release
# branch or a tag, a run in progress is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: cortex-core (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python the image ships — whatever `ubuntu-latest` is — and the floor of
          # pyproject.toml, 3.11, as the CLI and the runtime have. A floor CI never runs on is a
          # claim, not a guarantee.
          - { label: "Ubuntu, image's Python", python-version: "" }
          - { label: "Python 3.11", python-version: "3.11" }
    steps:
      - uses: actions/checkout@v7

      - if: matrix.python-version != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing is installed, on purpose: the core runs from source (ADR-007 §3.3).
      - name: Run the core suite
        working-directory: core
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          python3 -m unittest discover -s tests -v

  macos:
    # The Python the image ships, on a file system that ignores case, where two spellings of one
    # directory must still be one. The whole suite: the validator lists files in name order, not
    # in the file system's, so the outputs captured on ext4 hold on APFS too (ADR-008 §3.1).
    name: cortex-core (macOS, image's Python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the core suite
        working-directory: core
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          python3 -m unittest discover -s tests -v
