name: release

# Every merge into main, or into a line's branch N.x, is a release (ADR-009 §3.3): this workflow
# finds the version the push adds, builds it through binary.yml, and leaves it as a draft with its
# six assets. The maintainer publishes it from the Releases page; GitHub creates the tag then.
#
# A pre-release is cut by hand (§3.7): *Run workflow* on a release/** branch, with the version.
# *Run workflow* runs the workflow files of the branch it starts on, so a release candidate goes
# through the pipeline that branch will ship.
#
# The draft is created last, once every asset is built and checked; a re-run of a run that failed
# makes its own draft again, and a draft of another commit, or a published release, stops it.
on:
  push:
    branches: [main, "[0-9]+.x"]   # no paths filter: every push there is a release
  workflow_dispatch:
    inputs:
      version:
        description: "The pre-release to cut from this release/** branch — X.Y.Z-alpha.N, X.Y.Z-beta.N or X.Y.Z-rc.N"
        required: true
        type: string

# One release at a time: two would race for their version and for `latest`. GitHub keeps one run
# waiting per group: a third merge's run cancels the second's while it waits, and that release is
# drafted only by running its run again. Releases are hours apart; wait for a merge's draft before
# merging the next release (ADR-009 §9).
concurrency:
  group: release cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # drafts are listed only to a token with push access; nothing here writes
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
      target: ${{ steps.version.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # what the push adds since its `before`
          persist-credentials: false   # nothing here pushes: the token stays out of .git/config

      - id: version
        uses: ./.github/actions/release-version
        with:
          event: ${{ github.event_name }}
          ref: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          before: ${{ github.event.before }}
          version: ${{ inputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-body
          path: ${{ steps.version.outputs.body-file }}
          if-no-files-found: error

  build:
    needs: version
    uses: ./.github/workflows/binary.yml
    with:
      version: ${{ needs.version.outputs.version }}

  draft:
    name: draft
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the draft and its assets
      id-token: write        # sign the attestations
      attestations: write    # store them
    # Assets and binaries are gathered outside the checkout, in $RUNNER_TEMP: its own assets/ — the
    # README's logo — would otherwise ship with the release (found by the pre-release 0.0.0-test.1).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.target }}
          persist-credentials: false   # nothing here pushes: the token stays out of .git/config

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: cortex-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-body
          path: ${{ runner.temp }}/release-body

      # The spec of the release, from the target's tree — what `cortex sync` downloads for a project
      # pinned to this version by a newer binary (ADR-008 §3.3).
      - name: The spec archive
        run: python3 cli/build.py --spec-archive "$RUNNER_TEMP/release-assets"

      # Asset names carry no version, so that releases/latest/download/<asset> always names the
      # latest release's: the release itself is the version.
      - name: SHA256SUMS
        run: python3 cli/build.py --checksums "$RUNNER_TEMP/release-assets"

      # The archives, and the binaries inside them: `gh attestation verify ~/.cortex/bin/cortex
      # --repo xod-labs/cortex` then checks the installed file itself.
      - name: The binaries inside the archives
        run: |
          for archive in "$RUNNER_TEMP/release-assets"/cortex-linux-*.tar.gz "$RUNNER_TEMP/release-assets"/cortex-macos-*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            mkdir -p "$RUNNER_TEMP/release-binaries/$target" && tar -xzf "$archive" -C "$RUNNER_TEMP/release-binaries/$target" cortex
          done
          for archive in "$RUNNER_TEMP/release-assets"/cortex-*.zip; do
            target="$(basename "$archive" .zip)"
            mkdir -p "$RUNNER_TEMP/release-binaries/$target" && unzip -q "$archive" cortex.exe -d "$RUNNER_TEMP/release-binaries/$target"
          done
          ls -l "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/release-binaries"/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/*
            ${{ runner.temp }}/release-binaries/*/cortex*

      # Last, once every asset is built and checked: a failure before leaves nothing behind.
      - uses: ./.github/actions/release-draft
        with:
          version: ${{ needs.version.outputs.version }}
          target: ${{ needs.version.outputs.target }}
          body-file: ${{ runner.temp }}/release-body/release-body.md
          assets: ${{ runner.temp }}/release-assets
          prerelease: ${{ needs.version.outputs.prerelease }}
          latest: ${{ needs.version.outputs.latest }}
          expected: |
            SHA256SUMS
            cortex-linux-aarch64.tar.gz
            cortex-linux-x86_64.tar.gz
            cortex-macos-arm64.tar.gz
            cortex-spec.tar.gz
            cortex-windows-x86_64.zip
