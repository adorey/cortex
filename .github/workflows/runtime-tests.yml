name: runtime tests

on:
  push:
    branches: [main, "release/**"]     # a pull request's branch runs as a pull request, once
    paths:
      - "runtime/**"
      - "core/**"
      - "deploy/**"
      - ".github/workflows/runtime-tests.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "core/**"
      - "deploy/**"
      - ".github/workflows/runtime-tests.yml"

# A pull request's run is moot once its branch is pushed again: it is cancelled. On main, a release
# branch or a tag, a run in progress is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # exercises the PostgresStateStore contract against the service above
      CORTEX_TEST_DATABASE_URL: postgresql://cortex:cortex@localhost:5432/cortex_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime (with API, Postgres + test deps)
        working-directory: runtime
        # fastapi (core) + httpx (dev) make the API tests run rather than skip;
        # postgres extra makes the PostgresStateStore contract run against the service.
        # cortex-core comes from ../core, in the same command, so pip never looks for it on an index.
        run: pip install -e ../core -e ".[dev,serve,postgres]"

      - name: Run the test suite
        working-directory: runtime
        run: python -m unittest discover -s tests -v
