name: release guard
description: >-
  What a published release is checked against (ADR-009 §3.5): a version tag, the provenance of every
  asset naming the tag's commit, the assets expected and SHA256SUMS over them, immutability, and
  `latest` on the highest version. It repairs `latest`, and the pre-release box of an X.Y.Z that
  passes. Anything else fails, and opens one issue: the release cannot be repaired, only deleted,
  and its version is spent.

inputs:
  tag:
    description: The published release's tag.
    required: true
  expected:
    description: The names of the assets, one per line.
    default: ""
  signer-workflow:
    description: The workflow that builds releases and signs their provenance, `OWNER/REPO/.github/workflows/FILE`.
    required: true
  label:
    description: The label of the issue it opens.
    default: type:infra
  token:
    description: "A token that moves `latest` and opens issues: `contents: write`, `issues: write`, `attestations: read`."
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: The release guard
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        EXPECTED: ${{ inputs.expected }}
        SIGNER: ${{ inputs.signer-workflow }}
        LABEL: ${{ inputs.label }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}   # gh attestation verify
      run: >-
        python3 "$GITHUB_ACTION_PATH/guard.py" --tag "$TAG" --expected "$EXPECTED"
        --signer-workflow "$SIGNER" --label "$LABEL"
